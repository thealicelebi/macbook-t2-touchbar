[settings]
default_layer = "control"
esc = "auto"
dim_after = 30
off_after = 60
max_brightness = 130
slider_timeout = 5
fingerprint_width = 440
dim_while_scanning = true
nowplaying = "art"
viz_colors = "amethyst"

[weather]
location = "Istanbul"
units = "metric"
clock = "24h"

[theme]
background = "#000000"
button = "#171B28"
accent = "#A78BFA"
foreground = "#F5F3FF"

# --- 1. NORMAL KATMAN (Sadece Penguen) ---
[layers.control]
items = [
  "esc",
  "gap",
  { icon = "󰕚", layer = "apps", width = 55 },
  { icon = "󰄀", command = "gnome-screenshot -i", width = 70 },
  { preset = "weather", layer = "weather" },
  "nowplaying",
  "media",
  { icon = "󰈈", layer = "control_eco", width = 45 },
  "gap",
  "brightness", "keyboard",
  "gap",
  "volume", "mute",
]

# --- 2. ENERJİ TASARRUFU KATMANI (Sadece Penguen) ---
[layers.control_eco]
items = [
  "esc",
  "gap",
  { icon = "󰕚", layer = "apps", width = 55 },
  { icon = "󰄀", command = "gnome-screenshot -i", width = 70 },
  { preset = "weather", layer = "weather" },
  { icon = "󰝚", layer = "control", width = 45 },
  "gap",
  "brightness", "keyboard",
  "gap",
  "volume", "mute",
]

# --- 3. FN KATMANI ---
[layers.fn]
items = [
  "esc",
  "F1", "F2", "F3", "F4", "F5", "F6",
  "F7", "F8", "F9", "F10", "F11", "F12"
]

[layers.function]
items = [
  "esc",
  "F1", "F2", "F3", "F4", "F5", "F6",
  "F7", "F8", "F9", "F10", "F11", "F12"
]

[layers.apps]
items = [
  "back",
  { plugin = "dock", width = 1850, label = " ", style = "plain" }
]

[layers.weather]
items = [
  "back",
  { plugin = "weather", width = 1850, label = " ", style = "plain" }
]
